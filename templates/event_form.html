{% extends "base.html" %}

{% block title %}{% if event %}Edit Event{% else %}New Event{% endif %} — Mini Calendar{% endblock %}

{% block content %}
<div class="form-card">
    <h2>{% if event %}Edit Event{% else %}New Event{% endif %}</h2>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% if event %}/events/{{ event.id }}/edit{% else %}/events{% endif %}">

        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" required
                   value="{{ event.title if event else (form_data.title if form_data else '') }}">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ event.description if event and event.description else (form_data.description if form_data else '') }}</textarea>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location"
                   value="{{ event.location if event and event.location else (form_data.location if form_data else '') }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="start_datetime">Start *</label>
                <input type="datetime-local" id="start_datetime" name="start_datetime" required
                       value="{{ event.start_datetime.strftime('%Y-%m-%dT%H:%M') if event else (form_data.start_datetime if form_data else '') }}">
            </div>
            <div class="form-group">
                <label for="end_datetime">End *</label>
                <input type="datetime-local" id="end_datetime" name="end_datetime" required
                       value="{{ event.end_datetime.strftime('%Y-%m-%dT%H:%M') if event else (form_data.end_datetime if form_data else '') }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if event %}Save Changes{% else %}Create Event{% endif %}
            </button>
            <a href="{% if event %}/events/{{ event.id }}{% else %}/{% endif %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>
</div>
{% endblock %}
